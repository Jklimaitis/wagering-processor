# Infra local do desafio. Suba com: docker compose up -d
# Portas: 15433 (Postgres, porque a 5432 do host ja esta ocupada) e 4566 (LocalStack/SQS)

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-pg
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
